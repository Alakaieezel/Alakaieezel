<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" fill="none" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="lineA" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
